<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice & Money Receipt Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--desk:#e4ebe6;--panel:#fbfdfb;--ink:#15302a;--mut:#5d756c;--line:#c8d6cf;--acc:#6b2a2a;--grn:#3f8f4a;--fld:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0f1d19;--panel:#17282376;--ink:#e6f0ea;--mut:#92aaa0;--line:#2c443b;--acc:#e08a8a;--grn:#6fcf7b;--fld:#0f1d19}}
:root[data-theme="dark"]{--desk:#0f1d19;--panel:#172823;--ink:#e6f0ea;--mut:#92aaa0;--line:#2c443b;--acc:#e08a8a;--grn:#6fcf7b;--fld:#0f1d19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'Hind Siliguri','Segoe UI',sans-serif;font-size:15px}
.app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;max-width:1240px;margin:0 auto;padding:24px 20px 40px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
h1{font:700 24px/1.2 'Bricolage Grotesque','Hind Siliguri',sans-serif;margin:4px 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--desk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--ink);font:600 15px 'Hind Siliguri',sans-serif;padding:9px;cursor:pointer;border-radius:9px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--acc);border-radius:9px;transition:transform .35s cubic-bezier(.5,1.4,.5,1)}
.seg[data-t="receipt"] i{transform:translateX(100%)}
.seg button.on{color:#fff}
:root[data-theme="dark"] .seg button.on{color:#15302a}
label{display:block;font-weight:500;font-size:13.5px;color:var(--mut);margin:11px 0 4px}
input,select,textarea{width:100%;font:15px 'Hind Siliguri',sans-serif;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{margin-top:10px;font-size:13.5px;color:var(--mut);background:var(--desk);border-radius:9px;padding:8px 11px}
.calc b{color:var(--ink)}
details{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
.btns{display:grid;gap:10px;margin-top:18px}
button.go,button.dl{border:0;border-radius:11px;padding:13px;font:600 16px 'Hind Siliguri',sans-serif;cursor:pointer}
button.go{background:var(--acc);color:#fff}
:root[data-theme="dark"] button.go{color:#15302a}
button.dl{background:var(--grn);color:#08230f;word-break:break-all}
button:disabled{opacity:.55;cursor:wait}
.msg{min-height:20px;font-size:13.5px;color:var(--acc)}
.desk{min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut);font-size:13.5px}
.tag{font-weight:600;color:var(--ink)}
.stage{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2);overflow:hidden}
.stage.feed{animation:feed .45s cubic-bezier(.2,.9,.3,1)}
@keyframes feed{from{transform:translateX(40px) rotate(1.2deg);opacity:.2}}
.scaler{transform-origin:top left;width:794px}
.gen{display:block;width:100%;height:auto}
.stamp{position:absolute;right:7%;top:42%;border:4px solid var(--acc);color:var(--acc);font:700 28px 'Bricolage Grotesque',sans-serif;padding:6px 18px;border-radius:8px;transform:rotate(-12deg);background:rgba(255,255,255,.85);pointer-events:none;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.stage.feed,.stamp,.seg i{animation:none;transition:none}}
/* ---------- paper (A4 @ 794x1123) ---------- */
.paper{width:794px;height:1123px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;padding:50px 62px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.paper>*{flex-shrink:0}
.paper .sp{flex:1 1 0;min-height:0}
.paper .wm{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(2.6);opacity:.07;pointer-events:none}
.paper .hd{display:flex;justify-content:space-between;align-items:center}
.paper .addr{text-align:right;font-size:12.5px;line-height:19px}
.paper .addr b{font-size:12.5px}
.lg{display:flex;align-items:center;gap:8px}
.lgt{font:700 30px/1 Arial,sans-serif;color:#1a1a1a;letter-spacing:-.5px}
.lgt i{font-style:normal;color:#d9322e}
.lgs{font-size:14px;letter-spacing:5px;color:#444;margin-top:3px;padding-left:2px}
.paper .rule{height:5px;background:#6b2a2a;margin:34px 0 14px}
.paper .rule.b{margin:12px 0 0;border-top:1px solid #6b2a2a;border-bottom:3px solid #6b2a2a;background:none;height:7px}
.paper h2{line-height:28px;text-align:center;font-size:22px;margin:0 0 20px;letter-spacing:.5px}
.paper .meta{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:12px}
.logo{height:62px;width:auto;display:block}
.gt{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #555;border-left:1px solid #555;font-size:13.5px}
.gt th{background:#70ad47;color:#fff;padding:7px 8px;text-align:center;border-right:1px solid #555;border-bottom:1px solid #555}
.gt td{border-right:1px solid #555;border-bottom:1px solid #555;padding:7px 8px;vertical-align:top;line-height:20px}
.gt+.gt{margin-top:22px}
.paper td{white-space:pre-line;word-break:break-word}
.items th{text-align:left}.items td.r,.items th.r{text-align:right}
.items td{background:#e6f0da}
.items tr.tot td{background:#c9e0b4;font-weight:700}
.pls{text-align:center;font-weight:700;margin:26px 0}
.sig{align-self:flex-end;margin:16px 8px 26px 0;text-align:left;font-size:14px;line-height:22px}
.sig div:first-child{margin:56px 0 4px}
.thx{text-align:center;font-style:italic;font-size:14px;margin-top:6px}
.rc{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border-top:1px solid #555;border-left:1px solid #555;font-size:14px}
.rc td{border-right:1px solid #555;border-bottom:1px solid #555;padding:11px 12px;height:46px;vertical-align:middle;word-break:break-word}
.rc td.l{width:210px;background:#eef5e8;font-weight:700}
.pay{display:grid;grid-template-columns:1fr 1fr;margin:26px 0 0;width:100%;border-bottom:1px solid #555}
.pay>div{border-right:1px solid #555;display:flex;align-items:center;padding:12px;min-height:52px}
.pay .c1,.pay .c2{background:#70ad47;color:#fff;font-weight:700;border-top:1px solid #555;border-bottom:1px solid #555}
.pay .c1,.pay .amt{border-left:1px solid #555}
.pay .amt{display:flex;align-items:stretch;padding:0;min-height:104px}
.pay .amt>div{display:flex;align-items:center;padding:12px}
.pay .amt>div:first-child{flex:none;width:125px;border-right:1px solid #555;background:#eef5e8;font-weight:700}
.pay .amt>div:last-child{flex:1}
.pay .how{display:flex;flex-direction:column;align-items:stretch;padding:0;border-bottom:0}
.pay .how>div{display:flex;flex:1;min-height:52px;border-bottom:1px solid #555}
.pay .how>div:last-child{border-bottom:0}
.pay .how>div>div{display:flex;align-items:center;padding:12px}
.pay .how>div>div:first-child{flex:none;width:110px;border-right:1px solid #555;background:#eef5e8;font-weight:700}
.pay .how>div>div:last-child{flex:1}
.rsig{align-self:flex-start;margin:16px 0 26px;font-size:14px}
.rsig hr{border:0;border-top:2px solid #000;width:270px;margin:60px 0 12px}
</style>
</head>
<body>
<div class="app">
  <section>
    <h1>Invoice & Money Receipt</h1>
    <p class="sub">Fill in only the variable details. Everything else is preset.</p>
    <div class="panel">
      <div class="seg" data-t="invoice" id="seg"><i></i><button class="on" data-t="invoice">Invoice</button><button data-t="receipt">Money Receipt</button></div>
      <div id="form"></div>
      <details><summary>Static details (defaults, edit if needed)</summary><div id="stat"></div></details>
      <div class="btns">
        <div class="msg" id="msg" role="status"></div>
        <button class="go" id="go">Download PDF</button>
      </div>
    </div>
  </section>
  <section class="desk">
    <div class="bar"><span class="tag" id="tag">Preview: the PDF downloads exactly as shown</span><span id="fn"></span></div>
    <div class="stage" id="stage"><div class="scaler" id="scaler"><div id="paperHost"></div></div></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDate=iso=>{const [y,m,d]=(iso||today()).split('-').map(Number);return pad(d)+'/'+pad(m)+'/'+y};

function words(n){n=Math.round(n);if(n<=0)return '';const p=[];
 for(const [d,nm] of [[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand'],[100,'Hundred']]){if(n>=d){p.push((d>=1e7?words(Math.floor(n/d)):below(Math.floor(n/d)))+' '+nm);n%=d}}
 if(n>0)p.push(below(n));return p.join(' ')}
function below(n){if(n<20)return ONES[n];return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'')}

 receipt:[['name','Received from','text','Benchmark Solutions'],['address','Factory address (optional)','ta','Ventura Iconia, Level 3, Holding 37 Road No. 11, Banani, Dhaka 1213'],['office','Office address (optional)','ta','Ventura Iconia, Level 3, Holding 37 Road No. 11, Banani, Dhaka 1213'],['date','Date','date'],['code','File code (auto)','text'],['purpose','Purpose of payment (auto)','ta'],['amount','Amount (BDT)','text'],['account','Account','text'],['method','Payment method','sel',[['Cash','Cash'],['Cheque','Cheque']]],['chq','Cheque / reference no.','text']]
};
function money(){const f=S.f,a=parseFloat(String(f.amount).replace(/,/g,''))||0,v=parseFloat(f.vat)||0;let base,vat,total;
 if(f.mode==='incl'){total=a;base=Math.round(total/(1+v/100));vat=total-base}else{base=a;vat=Math.round(base*v/100);total=base+vat}return{a,base,vat,total}}
const fname=()=>{const c=(S.f.code||'DOC').replace(/[^\w-]+/g,'_');return (S.type==='invoice'?'invoice_':'money_receipt_')+c+'.pdf'};
function autos(){const f=S.f,t=S.touched,n=f.name.trim();
 if(!t.code)f.code=abbr(n);
 if(!t.invNo)f.invNo=f.code?f.code+'-EA-01':'';
 if(!t.desc)f.desc=n?'Energy assessment of newly installed equipment at '+n:'';
 if(!t.purpose)f.purpose=n?'Energy assessment of newly installed equipment at '+n:''}
function logo(){return `<img class="logo" src="${LOGO}" alt="Benchmark Solutions">`}
function logoOld(){return `<div class="lg"><svg width="64" height="64" viewBox="0 0 64 64"><path d="M24 7C9 9 6 31 16 41c4 4 2 9 4 14h19c2-8 12-10 12-23C51 16 40 5 24 7z" fill="none" stroke="#8fc0d2" stroke-width="1.6"/><path d="M11 11l19 20M30 31L11 45" stroke="#999" stroke-width="1"/><circle cx="10" cy="10" r="4" fill="#3aa845"/><circle cx="31" cy="31" r="7.5" fill="#2e7fe8"/><circle cx="11" cy="45" r="4" fill="#a3262a"/></svg><div><div class="lgt">B<i>e</i>nchm<i>a</i>rk</div><div class="lgs">Solutions</div></div></div>`}
const head=addr=>`<div class="hd">${logo()}<div class="addr"><b>${ST.co}</b><br>${addr}<br>Phone: ${esc(ST.phone)}<br>E-mail: ${esc(ST.email)}<br>Website: ${esc(ST.web)}</div></div><div class="rule"></div>`;
function paperHTML(){const f=S.f,m=money();
 const wm=`<div class="wm">${logo()}</div>`;
 if(S.type==='invoice')return `<div class="paper">${wm}${head(ST.addr1+'<br>'+ST.addr2)}<h2>INVOICE</h2>
 <div class="meta"><span>Invoice No.: ${esc(f.invNo)}</span><span>Date: ${esc(fmtDate(f.date))}</span></div>
 <table class="gt"><tr><th style="width:50%">Bill To</th><th>Payment to</th></tr><tr><td><b>${esc(f.name)}</b>${f.address.trim()?'<br>Factory: '+esc(f.address):''}${f.office.trim()?'<br>Office: '+esc(f.office):''}</td><td><b>${esc(ST.co)}</b><br>${ST.addr1}<br>${ST.addr2}<br>Phone: ${esc(ST.phone)}</td></tr></table>
 <table class="gt"><tr><th colspan="2">Account details</th></tr><tr><td style="width:50%">Account Name: <b>${esc(ST.accName)}</b><br>Account no: <b>${esc(ST.accNo)}</b><br>Bank: <b>${esc(ST.bank)}</b></td><td>Branch: <b>${esc(ST.branch)}</b><br>Routing Number: <b>${esc(ST.routing)}</b><br>Swift code: <b>${esc(ST.swift)}</b></td></tr><tr><td>TIN number</td><td>${esc(ST.tin)}</td></tr><tr><td>BIN number</td><td>${esc(ST.bin)}</td></tr></table>
 <table class="gt items"><tr><th style="width:64px;text-align:center">Sl No.</th><th>Item Description</th><th class="r" style="width:130px">Cost (BDT)</th></tr>
 <tr><td style="text-align:center;vertical-align:middle"><b>1</b></td><td style="height:52px">${esc(f.desc)}</td><td class="r"><b>${num(m.base)}</b></td></tr>
 <tr><td style="text-align:center;vertical-align:middle"><b>2</b></td><td>Vat (${esc(f.vat)}%)</td><td class="r"><b>${num(m.vat)}</b></td></tr>
 <tr class="tot"><td>Total</td><td style="text-align:center">${esc(taka(m.total))}</td><td class="r">${num(m.total)}</td></tr></table>
 <div class="pls">Please send the payment at your earliest convenience</div>
 <div class="sp"></div><div class="sig"><div>_____________________</div><div>${esc(ST.signer)}<br>${esc(ST.title)}</div></div>
 <div class="thx">Thanks for your great support and look forward to continuing our productive Partnership.</div><div class="rule b"></div></div>`;
 const cash=f.method==='Cash',cell=(on)=>on&&m.a?`BDT ${fmtNum(m.a)}`:'';
 return `<div class="paper">${wm}${head(ST.addrR)}<h2>MONEY RECEIPT</h2>
 <div style="margin-bottom:12px">Date: ${esc(fmtDate(f.date))}</div>
 <table class="rc"><tr><td class="l">Amount Received from &nbsp;:</td><td><b>${esc(f.name)}</b></td></tr>${(f.address.trim()?`<tr><td class="l">Factory Address &nbsp;:</td><td>${esc(f.address)}</td></tr>`:'')+(f.office.trim()?`<tr><td class="l">Office Address &nbsp;:</td><td>${esc(f.office)}</td></tr>`:'')||'<tr><td class="l">Address &nbsp;:</td><td></td></tr>'}<tr><td class="l">Purpose of Payment &nbsp;:</td><td>${esc(f.purpose)}</td></tr><tr><td class="l">Amount in Words &nbsp;:</td><td><b>${esc(taka(m.a))}</b></td></tr></table>
 <div class="pay"><div class="c1"><span>Account${f.account?': <b>'+esc(f.account)+'</b>':''}</span></div><div class="c2">Payment Made by</div>
 <div class="amt"><div>Amount Paid:</div><div><b>BDT ${m.a?fmtNum(m.a):''}</b></div></div>
 <div class="how"><div><div>Cash</div><div>${cell(cash)}</div></div><div><div>Cheque</div><div>${!cash?esc(f.chq)+(f.chq?' · ':'')+cell(true):''}</div></div></div></div>
 <div style="margin-top:34px">Amount Received By: <b>Benchmark Solutions</b></div>
 <div class="sp"></div><div class="rsig"><hr><b>Authorized signature (Recipient)</b></div>
 <div class="thx">Thanks for your great support and look forward to continuing our productive Partnership.</div><div class="rule b"></div></div>`}
function renderPaper(){$('paperHost').innerHTML=paperHTML();fit()}
function fit(){const w=$('stage').clientWidth,s=w/794;$('scaler').style.zoom=s;$('stage').style.height=(1123*s)+'px'}
new ResizeObserver(fit).observe($('stage'));
function buildForm(){
 $('form').innerHTML=FIELDS[S.type].map(([k,l,t,o])=>{const v=esc(S.f[k]);
  const inp=t==='ta'?`<textarea id="f_${k}" rows="2"${o?` placeholder="${esc(o)}"`:''}>${v}</textarea>`:t==='sel'?`<select id="f_${k}">${o.map(([a,b])=>`<option value="${a}"${S.f[k]===a?' selected':''}>${b}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t==='date'?'date':'text'}" value="${v}"${o?` placeholder="${esc(o)}"`:''} autocomplete="off">`;
  return `<label for="f_${k}">${l}</label>${inp}`}).join('')+'<div class="calc" id="calc"></div>';
 FIELDS[S.type].forEach(([k])=>{const el=$('f_'+k);el.addEventListener('input',()=>onIn(k,el.value))});
 $('stat').innerHTML=STAT.map(([k,l])=>`<label for="s_${k}">${l}</label><input id="s_${k}" value="${esc(ST[k])}">`).join('');
 STAT.forEach(([k])=>$('s_'+k).addEventListener('input',e=>{ST[k]=e.target.value;changed()}));
 calc()}
function calc(){const m=money();$('calc').innerHTML=S.type==='invoice'?`Excl. VAT <b>${fmtNum(m.base)}</b> + VAT <b>${fmtNum(m.vat)}</b> = Total <b>${fmtNum(m.total)}</b> BDT<br>${esc(taka(m.total))}`:(m.a?esc(taka(m.a)):'Amount in words fills in automatically')}
function onIn(k,v){S.f[k]=v;if(['code','invNo','desc','purpose'].includes(k))S.touched[k]=true;
 if(k==='name'||k==='code'){S.touched.code=k==='code'?true:S.touched.code;autos();['code','invNo','desc','purpose'].forEach(x=>{const e=$('f_'+x);if(e&&e.value!==S.f[x])e.value=S.f[x]})}
 changed()}
function changed(){$('msg').textContent='';$('fn').textContent=fname();calc();renderPaper()}
function setType(t){S.type=t;$('seg').dataset.t=t;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));buildForm();changed();const st=$('stage');st.classList.remove('feed');void st.offsetWidth;st.classList.add('feed')}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setType(b.dataset.t));
$('go').onclick=async()=>{
 if(!window.html2canvas||!window.jspdf){$('msg').textContent='Libraries did not load. Reload the page.';return}
 const d=await claude.use('downloads').catch(()=>null);
 $('go').disabled=true;$('go').textContent='Preparing…';$('msg').textContent='';
 try{const clone=$('paperHost').firstElementChild.cloneNode(true);Object.assign(clone.style,{position:'fixed',left:'-10000px',top:'0',transform:'none'});document.body.appendChild(clone);
  const cv=await html2canvas(clone,{scale:2.5,backgroundColor:'#ffffff'});clone.remove();
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'p'});
  pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);
  const blob=pdf.output('blob');
  if(!d){$('msg').textContent='Downloads are not available in this view. Open the artifact link in a browser.'}
  else{await d.save({filename:fname(),data:blob});$('msg').textContent='Saved: '+fname()}
 }catch(e){$('msg').textContent=e&&e.code==='declined'?'Download cancelled.':'Could not create or save the PDF. Try again.'}
 $('go').disabled=false;$('go').textContent='Download PDF'};
buildForm();autos();changed();
</script>
</body>
</html>
